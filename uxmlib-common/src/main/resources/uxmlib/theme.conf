# The look of this server: the colours, the glyphs, and the writing of the interface.
#
# Copy this file, keep the keys you want and delete the rest. It has three layers, and only
# the middle one is shared with the files that write text.
#
#   palette   the colours of this server, under whatever names this server likes
#   roles     the jobs a colour does. A message file names a job and never a colour
#   wheel     the colours decoration is taken from, in order
#
# A key this file leaves out keeps the shipped value, so three lines is a valid file.
#
# What this library ships is a starting point and not a look. Every role answers, in one of
# the sixteen colours Minecraft has always had, so text is readable before anybody writes a
# file. Nothing else is decided: no glyph, no category colour, no gradient and no small
# capitals. The blocks below that are commented out are the ones this library holds no
# opinion about; write them and they take effect.

# The colours, under your own names. Nothing outside this file speaks these names, so rename
# one, delete one or add ten and no message anybody wrote breaks. A role below points at one.
#
# These are the vanilla sixteen. Replace them with the colours of your own brand.
palette {
  white        = "#ffffff"
  gray         = "#aaaaaa"
  dark_gray    = "#555555"
  yellow       = "#ffff55"
  gold         = "#ffaa00"
  green        = "#55ff55"
  red          = "#ff5555"
  aqua         = "#55ffff"
  blue         = "#5555ff"
  light_purple = "#ff55ff"
}

# The jobs. A message writes <accent>, <value> or <good>, and this block says what colour that
# is. The value on the right is a palette name or a hex code, so either of these works:
#
#   accent = aqua
#   accent = "#55ffff"
#
# The list is open. Write a job of your own here and your own files may use it as a tag:
#
#   roles { premium = light_purple }   then a file may write <premium>Thank you</premium>
roles {
  # The brand. It carries the prefix of a message, a header, and the accent of a menu.
  accent  = aqua

  # The reading colours. Body is the text of a message, subtext a description in a menu, muted
  # a counter or a date, dim a separator or something that cannot be used.
  body    = white
  subtext = gray
  muted   = gray
  dim     = dark_gray

  # The furniture of a menu: the glyph at the start of a line, and the category line under a
  # title.
  icon    = gray
  crumb   = dark_gray

  # A name, a number, a duration, an amount of anything that is not money.
  value   = yellow

  # The three reflexes. Green is positive, red is negative, gold wants attention.
  good    = green
  bad     = red
  warn    = gold

  # Money, a level and the word "click". Separate jobs so that one can move without the others.
  money   = gold
  level   = light_purple
  cta     = yellow

  # A neutral note, a rank, and an event or a bonus.
  info    = aqua
  rank    = light_purple
  event   = blue
}

# The wheel: the colours decoration takes, in order.
#
# A menu asks for the arc at a position and gets that colour and the next one. So a screen of
# twelve tiles reads as twelve headings without a single file naming a colour, and the wheel
# wraps, so a menu longer than the wheel keeps working. Name fewer than two colours, or none,
# and every heading falls back to the header gradient below.
#
# wheel = [ aqua, green, yellow, gold, red, light_purple, blue ]

# Named gradients. A heading painted across two colours is what makes it read as finished
# rather than merely coloured; leave a name out and whatever uses it stays a flat colour. One
# stop is a flat colour too, which is how you switch a gradient off without deleting the key.
#
# "header" is the one name this library asks for: it is what a <h:'TITLE'> token paints with,
# and what a heading takes when nothing names another. A stop is a palette name or a hex code.
#
# A <h:'TITLE':name> token may also name a role, which paints the heading in that one colour,
# or a position on the wheel written in digits: <h:'TITLE':4>. Use the wheel for a screen of
# tiles, a role for a heading that always means the same thing, and a named gradient when you
# want a sweep of your own.
#
# A <g:'NAME':wheel> token paints a name across every colour of the wheel, with no bold and in
# the letters the file wrote. That is the sweep a server name usually wants.
#
# gradients {
#   header = [ aqua, blue ]
# }

# The glyphs the structure is drawn with. They are furniture rather than words, which is why
# they live here and not in a language file: changing one changes every plugin at once, and a
# translator never has to copy a character they cannot type.
#
# Nothing is drawn until this file names it. A glyph nobody configured leaves a gap, so a
# plugin that only wanted the colours is not decorated by a library. The set below is the one
# our own interfaces use; write your own, or none.
#
# glyphs {
#   separator   = "▶"   # between a message's category word and the sentence
#   title       = "◆"   # the first line of a menu tile
#   description = "✎"   # the description header of a tile
#   details     = "≡"   # the details header of a tile
#   row         = "•"   # one fact under the details header
#   status      = "•"   # one state under the details header
#   action      = "→"   # the line that says what a click does
# }

# prefix {
#   # The colour of a category. The name on the left is the word in the message file, the value
#   # on the right is a role from the block above. A category that is not named here reads in
#   # the accent colour, which is what every category does until this block exists.
#   categories {
#     error = "bad"
#     money = "good"
#     shop  = "good"
#     event = "event"
#   }
# }

# Small capitals are a way of writing the interface: the Latin letters in their small-capital
# forms.
#
# Nothing is converted until this file names a language, because a typeface is taste and the
# library does not hold an opinion about yours. Name one and every message and every menu of
# that language is written in small capitals.
#
# They exist for the Latin alphabet only. A language whose letters have no small-capital form
# keeps its own writing, so name a language only when every letter of it converts. A language
# this file does not name is written as the translator wrote it.
# small-caps {
#   en = true
#   tr = false
# }
