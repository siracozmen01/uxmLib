[versions]
# language / platform
# The toolchain must be 25: paper-api 26.x ships Java 25 class files, which a Java 21 compiler cannot
# read. The *output* stays at Java 21 bytecode (see java-release), which the server has no opinion about:
# a Java 25 runtime reads Java 21 class files. It is what lets the parts of this library that never touch
# a server, the config reader, the storage layer, the Redis bus, be used from an ordinary Java 21 project.
java-toolchain = "25"
java-release   = "21"

# Paper 26.x dropped the "-R0.1-SNAPSHOT" scheme for build-stamped release artifacts.
paper       = "26.2.build.112-stable"

# Match the Adventure version Paper 26.2 bundles at runtime, so compileOnly == runtime. The 4.x -> 5.x
# bump dropped net.kyori.examination and reworked ClickEvent; neither is on any code path here, and the
# rest of the surface this library touches is byte-for-byte identical across 4.21 and 5.2.
adventure   = "5.2.0"

# runtime libs (infra only, not Minecraft competitors; the MC-facing API is ours)
configurate = "4.1.2"
hikari      = "6.2.1"
# Only ever compileOnly/testRuntimeOnly: Paper ships slf4j 2.x, and Hikari asks for 1.7.36. See uxmlib-storage.
slf4j       = "2.0.17"
caffeine    = "3.1.8"
jspecify    = "1.0.0"
brigadier   = "1.3.10"   # com.mojang:brigadier: bundled by Paper at runtime; compileOnly only

# JDBC drivers (storage). SQLite is the default; the others are network options the consumer opts into.
sqlite-jdbc  = "3.49.1.0"   # org.xerial:sqlite-jdbc
mariadb-jdbc = "3.5.3"      # org.mariadb.jdbc:mariadb-java-client (also speaks the MySQL wire protocol)
postgresql   = "42.7.4"     # org.postgresql:postgresql
h2           = "2.3.232"    # com.h2database:h2: pure-Java embedded backend; EPL/MPL, infra-only opt-in

# soft-depend integrations (compileOnly; reached only past a plugin-present guard)
luckperms      = "5.5"
vault          = "1.7.1"        # com.github.MilkBowl:VaultAPI: JitPack
vaultunlocked  = "2.16"         # net.milkbowl.vault:VaultUnlockedAPI, codemc repo
placeholderapi = "2.11.6"       # me.clip:placeholderapi, extendedclip repo
worldguard     = "7.0.13"       # com.sk89q.worldguard:worldguard-bukkit, enginehub repo
towny          = "0.100.4.0"    # com.palmergames.bukkit.towny:towny, glaremasters repo
# org.geysermc.floodgate:api, on repo.opencollab.dev and not on Maven Central. Cumulus, the Bedrock form
# library, arrives with it in compile scope, so it needs no coordinate of its own.
#
# Upstream publishes no release of either artifact, ever: every version in the floodgate api and the cumulus
# metadata is a snapshot. So there is no released version to move to. A floating "-SNAPSHOT" would let a build
# tomorrow compile against different bytes with nothing in this repository changing, which a published library
# must not do, so the exact timestamped build is named instead. It is compileOnly, so it reaches neither the
# POM nor the jar and no consumer inherits it. Bump it deliberately, the way every other line here is bumped.
floodgate      = "2.2.5-20260809.110940-20"

# tests
junit    = "5.12.1"
assertj  = "3.27.3"
mockito  = "5.20.0"
mockbukkit = "4.116.1"   # org.mockbukkit.mockbukkit:mockbukkit-v26.2
archunit = "1.3.0"
jqwik    = "1.9.3"

# tooling
errorprone   = "2.37.0"
nullaway     = "0.12.3"
spotless     = "7.0.2"
palantir-fmt = "2.52.0"
shadow       = "9.4.1"

# Netty: the channel/pipeline types for the experimental uxmlib-pipeline module. compileOnly: Paper bundles
# Netty at runtime but paper-api's POM does not export it, so it must be pinned here to match what the server
# ships (4.2.x, Paper 26.2). Infra dependency, never shaded.
netty        = "4.2.15.Final"
# cross-server sync (storage). Lettuce is a pure-infra Redis client on Maven Central; compileOnly + test only,
# constructed solely when a Redis URI is configured (the present-guard for RedisDataSynchronizer).
lettuce = "7.6.0.RELEASE"   # io.lettuce:lettuce-core

[libraries]
paper-api         = { module = "io.papermc.paper:paper-api",            version.ref = "paper" }
# The Mojang-mapped dev bundle. Naming it here rather than assembling the coordinate in a build script
# keeps this file the only place the server line is pinned.
devbundle-modern  = { module = "io.papermc.paper:dev-bundle",           version.ref = "paper" }
adventure-api     = { module = "net.kyori:adventure-api",                     version.ref = "adventure" }
adventure-mini    = { module = "net.kyori:adventure-text-minimessage",        version.ref = "adventure" }
adventure-plain   = { module = "net.kyori:adventure-text-serializer-plain",   version.ref = "adventure" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon",   version.ref = "configurate" }
brigadier         = { module = "com.mojang:brigadier",                  version.ref = "brigadier" }
hikari            = { module = "com.zaxxer:HikariCP",                   version.ref = "hikari" }
slf4j-api         = { module = "org.slf4j:slf4j-api",                   version.ref = "slf4j" }
caffeine          = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
sqlite-jdbc       = { module = "org.xerial:sqlite-jdbc",                version.ref = "sqlite-jdbc" }
mariadb-jdbc      = { module = "org.mariadb.jdbc:mariadb-java-client",  version.ref = "mariadb-jdbc" }
postgresql        = { module = "org.postgresql:postgresql",            version.ref = "postgresql" }
h2                = { module = "com.h2database:h2",                     version.ref = "h2" }
jspecify          = { module = "org.jspecify:jspecify",                 version.ref = "jspecify" }

luckperms-api     = { module = "net.luckperms:api",                     version.ref = "luckperms" }
vault-api         = { module = "com.github.MilkBowl:VaultAPI",          version.ref = "vault" }
vaultunlocked-api = { module = "net.milkbowl.vault:VaultUnlockedAPI",   version.ref = "vaultunlocked" }
placeholderapi    = { module = "me.clip:placeholderapi",               version.ref = "placeholderapi" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
towny             = { module = "com.palmergames.bukkit.towny:towny",     version.ref = "towny" }
floodgate-api     = { module = "org.geysermc.floodgate:api",             version.ref = "floodgate" }
lettuce-core      = { module = "io.lettuce:lettuce-core",              version.ref = "lettuce" }

junit-bom         = { module = "org.junit:junit-bom",                   version.ref = "junit" }
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter" }
assertj           = { module = "org.assertj:assertj-core",             version.ref = "assertj" }
mockito-core      = { module = "org.mockito:mockito-core",             version.ref = "mockito" }
mockito-jupiter   = { module = "org.mockito:mockito-junit-jupiter",    version.ref = "mockito" }
mockbukkit        = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
archunit-junit    = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik             = { module = "net.jqwik:jqwik",                       version.ref = "jqwik" }

errorprone-core   = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway          = { module = "com.uber.nullaway:nullaway",           version.ref = "nullaway" }

netty-transport   = { module = "io.netty:netty-transport",            version.ref = "netty" }

[bundles]
testing   = ["junit-jupiter", "assertj", "mockito-core", "mockito-jupiter"]
adventure = ["adventure-api", "adventure-mini"]

[plugins]
shadow            = { id = "com.gradleup.shadow",   version.ref = "shadow" }
spotless          = { id = "com.diffplug.spotless",  version.ref = "spotless" }
errorprone        = { id = "net.ltgt.errorprone",    version = "4.4.0" }
nullaway-plugin   = { id = "net.ltgt.nullaway",      version = "3.0.0" }
# paperweight userdev: supplies the Mojang-mapped dev bundle (Paper API + net.minecraft / craftbukkit)
# the packet-nametag renderer compiles against. Only uxmlib-nametags applies it; quarantined to one module.
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version = "2.0.0-beta.22" }
